[profile.default]
solc_version = "0.8.35"
# Chose the target EVM rules.
evm_version = "osaka"
# Decide whether to use extra code simplification.
optimizer = false
# Chose the compilation route.
# `false` uses the conventional route.
via_ir = false
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@chainlink/contracts/=lib/chainlink-evm/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts@4.9.6/=lib/openzeppelin-contracts/contracts/",
    "@solmate=lib/solmate/src/",
]
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
]

[lint]
lint_on_build = true
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
